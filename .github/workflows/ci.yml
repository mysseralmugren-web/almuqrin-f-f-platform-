name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - preview/security-candidate-20260824

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Finance AI acceptance
        run: node scripts/finance-ai/validate-suite.mjs

      - name: Document QR acceptance
        run: node scripts/documents/validate-qr.mjs

      - name: Static security regressions
        run: bun run test:security:static

      - name: SECURITY DEFINER governance
        run: node scripts/security/security-definer-governance.mjs

      - name: Unit security regressions
        run: bun run test:security:unit
